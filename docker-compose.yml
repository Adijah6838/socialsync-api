services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: socialsync
      POSTGRES_PASSWORD: socialsync_pass
      POSTGRES_DB: socialsync_db
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
